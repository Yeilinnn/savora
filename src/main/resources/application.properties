spring.application.name=savora

spring.datasource.url=jdbc:postgresql://localhost:5432/savora
spring.datasource.username=dev
spring.datasource.password=dev

spring.flyway.enabled=true

# OJO Boot 4: la propiedad de conexión de Mongo se movió de spring.data.mongodb.uri
# a spring.mongodb.uri (MongoAutoConfiguration ya no depende de Spring Data). Con la
# clave vieja, Spring cae al default mongodb://localhost/test — la causa exacta del
# bug que reportó el profe.
spring.mongodb.uri=mongodb://localhost:27017/savora
spring.data.mongodb.auto-index-creation=true