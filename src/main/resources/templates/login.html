<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Savora — Administración</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
</head>
<body>
<main>
    <div class="card" style="max-width: 420px; margin: 3rem auto;">
        <h1>Savora Admin</h1>
        <p>Inicie sesión con un usuario de rol <strong>NEGOCIO</strong>.</p>
        <p class="mensaje" th:if="${mensaje}" th:text="${mensaje}"></p>
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <p class="error" th:if="${param.error}">Usuario o contraseña incorrectos.</p>
        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text" required autofocus/>
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" required/>
            <button type="submit">Entrar</button>
        </form>
    </div>
</main>
</body>
</html>
