<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${titulo} + ' · Savora Admin'">Savora Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin.css(v=2)}"/>
</head>
<body>
<header th:fragment="cabecera">
    <div class="marca">
        <span class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14"/><path d="M5 19c2-4 5-7 9-9"/></svg>
        </span>
        <span>Savora</span>
        <small>Admin</small>
    </div>
    <nav>
        <a th:href="@{/admin/negocios}"
           th:classappend="${seccionActiva == 'negocios'} ? 'activo'">Negocios</a>
        <a th:href="@{/admin/usuarios}"
           th:classappend="${seccionActiva == 'usuarios'} ? 'activo'">Usuarios</a>
        <a th:href="@{/admin/categorias}"
           th:classappend="${seccionActiva == 'categorias'} ? 'activo'">Categorías</a>
        <a th:href="@{/admin/organizaciones}"
           th:classappend="${seccionActiva == 'organizaciones'} ? 'activo'">Organizaciones</a>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit">Salir</button>
        </form>
    </nav>
</header>
</body>
</html>
