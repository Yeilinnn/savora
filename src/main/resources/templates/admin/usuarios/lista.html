<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: head('Usuarios')}"></head>
<body>
<header th:replace="~{fragments/admin-layout :: cabecera}"></header>
<main>
    <div class="card">
        <span class="etiqueta-seccion">Administración</span>
        <h1>Usuarios <span>registrados</span></h1>
        <p class="sub">Active o desactive cuentas de clientes y negocios.</p>

        <p class="mensaje" th:if="${mensaje}" th:text="${mensaje}"></p>

        <div class="resumen">
            <div class="dato">
                <span>Total de usuarios</span>
                <strong th:text="${pagina.totalElements}">0</strong>
            </div>
        </div>

        <table>
            <thead>
            <tr>
                <th>Id</th>
                <th>Usuario</th>
                <th>Rol</th>
                <th>Asociado a</th>
                <th>Estado</th>
                <th>Acción</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${pagina.content}">
                <td th:text="${u.id}"></td>
                <td th:text="${u.username}"></td>
                <td th:text="${u.rol}"></td>
                <td th:text="${u.asociado}"></td>
                <td>
                    <span class="etiqueta" th:classappend="${u.activo} ? '' : 'inactivo'"
                          th:text="${u.activo} ? 'activo' : 'desactivado'"></span>
                </td>
                <td>
                    <form th:if="${u.rol != 'ADMIN'}"
                          th:action="@{/admin/usuarios/{id}/activo(id=${u.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="valor" th:value="${!u.activo}"/>
                        <button type="submit" th:classappend="${u.activo} ? 'alerta'"
                                th:text="${u.activo} ? 'Desactivar' : 'Activar'">Desactivar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="paginacion">
            <a th:if="${pagina.hasPrevious()}"
               th:href="@{/admin/usuarios(page=${pagina.number - 1},size=${pagina.size})}">← Anterior</a>
            <span th:text="'Página ' + (${pagina.number} + 1) + ' de ' + ${pagina.totalPages}"></span>
            <a th:if="${pagina.hasNext()}"
               th:href="@{/admin/usuarios(page=${pagina.number + 1},size=${pagina.size})}">Siguiente →</a>
        </div>
    </div>
</main>
</body>
</html>
