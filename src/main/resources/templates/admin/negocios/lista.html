<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: head('Negocios')}"></head>
<body>
<header th:replace="~{fragments/admin-layout :: cabecera}"></header>
<main>
    <div class="card">
        <span class="etiqueta-seccion">Administración</span>
        <h1>Negocios <span>registrados</span></h1>
        <p class="sub">Apruebe las solicitudes nuevas y suspenda a quien incumpla.</p>

        <p class="mensaje" th:if="${mensaje}" th:text="${mensaje}"></p>

        <div class="resumen">
            <div class="dato">
                <span>Total de negocios</span>
                <strong th:text="${pagina.totalElements}">0</strong>
            </div>
            <div class="dato" th:classappend="${pendientes > 0} ? 'alerta-dato'">
                <span>Pendientes de aprobación</span>
                <strong th:text="${pendientes}">0</strong>
            </div>
        </div>

        <table>
            <thead>
            <tr>
                <th>Id</th>
                <th>Negocio</th>
                <th>Tipo</th>
                <th>Ubicación</th>
                <th>Usuario</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="n : ${pagina.content}">
                <td th:text="${n.id}"></td>
                <td th:text="${n.nombre}"></td>
                <td th:text="${n.tipoNegocio}"></td>
                <td th:text="${n.ubicacion}"></td>
                <td th:text="${n.usuario}"></td>
                <td><span class="etiqueta" th:classappend="${n.estado}" th:text="${n.estado}"></span></td>
                <td>
                    <form th:if="${n.estado != 'aprobado'}"
                          th:action="@{/admin/negocios/{id}/estado(id=${n.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="estado" value="aprobado"/>
                        <button type="submit" th:text="${n.estado == 'pendiente'} ? 'Aprobar' : 'Reactivar'">Aprobar</button>
                    </form>
                    <form th:if="${n.estado != 'suspendido'}"
                          th:action="@{/admin/negocios/{id}/estado(id=${n.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="estado" value="suspendido"/>
                        <button type="submit" class="alerta"
                                th:text="${n.estado == 'pendiente'} ? 'Rechazar' : 'Suspender'">Suspender</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="paginacion">
            <a th:if="${pagina.hasPrevious()}"
               th:href="@{/admin/negocios(page=${pagina.number - 1},size=${pagina.size})}">← Anterior</a>
            <span th:text="'Página ' + (${pagina.number} + 1) + ' de ' + ${pagina.totalPages}"></span>
            <a th:if="${pagina.hasNext()}"
               th:href="@{/admin/negocios(page=${pagina.number + 1},size=${pagina.size})}">Siguiente →</a>
        </div>
    </div>
</main>
</body>
</html>
