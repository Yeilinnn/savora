<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: head(${tituloFormulario})}"></head>
<body>
<header th:replace="~{fragments/admin-layout :: cabecera}"></header>
<main>
    <div class="card">
        <h1 th:text="${tituloFormulario}">Formulario</h1>
        <form th:action="${categoriaId} != null ? @{/admin/categorias/{id}(id=${categoriaId})} : @{/admin/categorias}"
              method="post" th:object="${categoriaFormulario}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <label for="nombre">Nombre</label>
            <input id="nombre" type="text" th:field="*{nombre}"/>
            <p class="campo-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p>
            <button type="submit">Guardar</button>
            <a class="btn" th:href="@{/admin/categorias}">Cancelar</a>
        </form>
    </div>
</main>
</body>
</html>
