<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: head('Organizaciones')}"></head>
<body>
<header th:replace="~{fragments/admin-layout :: cabecera}"></header>
<main>
    <div class="card">
        <h1>Organizaciones comunitarias</h1>
        <p class="mensaje" th:if="${mensaje}" th:text="${mensaje}"></p>
        <a class="btn" th:href="@{/admin/organizaciones/nueva}">Nueva organización</a>
        <table>
            <thead>
            <tr>
                <th>Id</th>
                <th>Nombre</th>
                <th>Tipo</th>
                <th>Capacidad (kg)</th>
                <th>Contacto</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="o : ${pagina.content}">
                <td th:text="${o.id}"></td>
                <td th:text="${o.nombre}"></td>
                <td th:text="${o.tipo}"></td>
                <td th:text="${o.capacidadRecoleccion}"></td>
                <td th:text="${o.contacto}"></td>
                <td><a th:href="@{/admin/organizaciones/{id}/editar(id=${o.id})}">Editar</a></td>
            </tr>
            </tbody>
        </table>
        <div class="paginacion">
            <span th:text="'Página ' + (${pagina.number} + 1) + ' de ' + ${pagina.totalPages}"></span>
            <a th:if="${pagina.hasPrevious()}"
               th:href="@{/admin/organizaciones(page=${pagina.number - 1},size=${pagina.size})}">Anterior</a>
            <a th:if="${pagina.hasNext()}"
               th:href="@{/admin/organizaciones(page=${pagina.number + 1},size=${pagina.size})}">Siguiente</a>
        </div>
    </div>
</main>
</body>
</html>
