name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Dar permisos a gradlew
        run: chmod +x ./gradlew

      - name: Compilar y probar
        run: ./gradlew build

  spa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spa

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: spa/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la SPA
        run: npm run build
        env:
          VITE_API_URL: https://ejemplo.invalid
