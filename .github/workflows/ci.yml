name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Dar permisos a gradlew
        run: chmod +x ./gradlew

      - name: Compilar, probar y verificar cobertura
        run: ./gradlew build

  spa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spa

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: spa/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la SPA
        run: npm run build
        env:
          VITE_API_URL: https://ejemplo.invalid

  deploy:
    needs: [ api, spa ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Desplegar API (Render)
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_API no configurado; omitiendo despliegue de API."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK"

      - name: Desplegar SPA (Render)
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_SPA }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_SPA no configurado; omitiendo despliegue de SPA."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK"
